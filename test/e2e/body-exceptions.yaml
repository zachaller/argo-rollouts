# Test name -> reason its body is allowed to differ from the baseline.
# Read by `go run ./hack/testmigration bodydiff`. An entry whose test no longer
# differs is reported as stale.
TestRolloutWithExperimentAndAnalysis: >-
  Removed s.T().Parallel(). Testify suites share one T between methods, so a
  parallel suite method resumes with another test's T once -parallel is above 1.
TestCanarySetCanaryScale: >-
  Removed s.T().Parallel(), for the same reason. The harness constructor marks
  the converted test parallel, and Go panics if Parallel is called twice.
TestCanaryDynamicStableScaleAbortScaleDownDelay: >-
  Added WaitForRolloutCanaryWeight(0) in front of the Sleep(2s) that precedes
  the final assertions. The canary weight was still 25 after the sleep alone in
  2 of 20 runs at parallelism 8. The sleep stays: it is what shows the canary
  keeps its pods for a while after traffic is back on stable. The assertions
  are unchanged.
TestRolloutWithMaxSurgeScalingDuringUpdate: >-
  The update now sets command: [/bad-command] instead of changing the CPU
  request, as TestRolloutScalingDuringUpdate already does. The asserted pod
  counts exist only while no new pod is ready; with a working update that
  lasted a second or two, and the test failed in 14 of 60 runs at parallelism
  4, 8 and 16. The asserted counts are unchanged.
TestKubectlWaitForPaused: >-
  The two direct kubectl wait calls now pass -n with the rollout's namespace.
  Without it kubectl looks in the kubeconfig's default namespace, and the test
  now runs in a namespace of its own. The conditions waited for are unchanged.
TestKubectlWaitForCompleted: >-
  The two direct kubectl wait calls now pass -n with the rollout's namespace,
  for the same reason. The conditions waited for are unchanged.
TestIstioHostSplit: >-
  s.TearDownSuite() at the end of each case became s.DeleteResources(). It
  runs the same deletion code. The suite's version selected every object with
  the e2e label in the shared namespace; this one selects the objects labelled
  with this test's name, which in a namespace per test are the same objects.
TestIstioHostSplitOnlyTls: >-
  s.TearDownSuite() at the end of each case became s.DeleteResources().
TestIstioHostSplitExperimentStep: >-
  s.TearDownSuite() at the end of the test became s.DeleteResources().
TestIstioSubsetSplitExperimentStep: >-
  s.TearDownSuite() at the end of the test became s.DeleteResources().
  The constructor is called with fixtures.Serial: the test runs alone, before
  the parallel tests, as it did in the suite. Deleting a Rollout that manages
  a DestinationRule can crash the controller when the controller is busy (2
  of 13 parallel runs; 0 of 68 serial runs). See
  test/migration-reports/fix-plans/istio-destinationrule-sync-error-crashes-controller.md.
TestIstioSubsetSplitInStableDownscaleAfterCanaryAbort: >-
  s.TearDownSuite() at the end of the test became s.DeleteResources().
  The constructor is called with fixtures.Serial: the test runs alone, before
  the parallel tests, as it did in the suite. Deleting a Rollout that manages
  a DestinationRule can crash the controller when the controller is busy (2
  of 13 parallel runs; 0 of 68 serial runs). See
  test/migration-reports/fix-plans/istio-destinationrule-sync-error-crashes-controller.md.
TestBlueGreenDuration_SupersededRollback: >-
  Added Sleep(1s) between creating revision 1 and updating to revision 2, as
  the three RollbackOutsideWindow and RollbackInsideWindow tests already have.
  The controller tells a rollback by comparing ReplicaSet creation timestamps,
  which have one-second resolution. When revisions 1 and 2 were created in the
  same second the update back to revision 1 was not fast-tracked, and the test
  timed out waiting for Healthy: 7 of 20 runs of the unconverted serial suite.
  The assertions are unchanged. See
  test/migration-reports/fix-plans/rollback-not-detected-within-one-second.md.
TestBlueGreenPromoteFull: >-
  Added WaitForPrePromotionAnalysisRun() between the Sleep(5s) and
  WaitForPrePromotionAnalysisRunPhase("Running"). The phase wait looks the
  AnalysisRun up once and fails when it does not exist yet, and at parallelism
  16 the controller had not created it after the five seconds. The test now
  allows the run up to the usual wait timeout to appear, where it used to
  allow five seconds. Everything it asserts afterwards is unchanged.
TestControllerMetrics: >-
  assert.NoError became require.NoError. When the metrics endpoint is not
  reachable the response is nil, and the next line dereferenced it. Under the
  testify suite that panic failed this test; in a plain test function it stops
  the whole test binary. The test fails in the same situations as before.
TestIstioSubsetSplit: >-
  The body is unchanged. The constructor is called with fixtures.Serial: the
  test runs alone, before the parallel tests, as it did in the suite. Deleting
  a Rollout that manages a DestinationRule can crash the controller when the
  controller is busy (2 of 13 parallel runs; 0 of 68 serial runs). See
  test/migration-reports/fix-plans/istio-destinationrule-sync-error-crashes-controller.md.
TestIstioSubsetSplitSingleRoute: >-
  The body is unchanged. The constructor is called with fixtures.Serial, for
  the same reason as TestIstioSubsetSplit.
