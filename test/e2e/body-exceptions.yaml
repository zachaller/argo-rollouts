# Test name -> reason its body is allowed to differ from the baseline.
# Read by `go run ./hack/testmigration bodydiff`. An entry whose test no longer
# differs is reported as stale.
TestExperimentSuite/TestRolloutWithExperimentAndAnalysis: >-
  Removed s.T().Parallel(). Testify suites share one T between methods, so a
  parallel suite method resumes with another test's T once -parallel is above 1.
TestCanarySetCanaryScale: >-
  Removed s.T().Parallel(), for the same reason. The harness constructor marks
  the converted test parallel, and Go panics if Parallel is called twice.
TestCanaryDynamicStableScaleAbortScaleDownDelay: >-
  Replaced one Sleep(2s) with WaitForRolloutCanaryWeight(0) before the final
  assertions. The canary weight was still 25 after the sleep in 2 of 20 runs at
  parallelism 8. The assertions that follow are unchanged.
TestCanaryScaleDownOnAbort: >-
  Added WaitForServiceSelector before the selector check. The check ran with no
  wait as soon as the rollout reported Degraded, and failed 4 times in 40 runs
  at parallelism 8 and 16 because the canary Service was still on the canary.
  The asserted selector is unchanged.
