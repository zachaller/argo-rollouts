name: Testing

on:
  push:
    branches:
      - 'master'
      - 'release-*'
  pull_request:
    branches:
      - 'master'
      - 'release-*'
  # The inputs only affect the e2e job. They exist to measure the e2e tests:
  # how long they take at a given parallelism, how often they fail, and which
  # tests catch a deliberately broken controller.
  workflow_dispatch:
    inputs:
      e2e_parallel:
        description: 'go test -parallel for the e2e tests. A comma-separated list runs one configuration per value.'
        default: '8'
      e2e_test_options:
        description: 'Extra go test flags for the e2e tests, for example: -run TestCanary'
        default: ''
      e2e_repeat:
        description: 'How many times each e2e job runs the tests, one run after another'
        default: '1'
      e2e_jobs:
        description: 'Identical e2e jobs per configuration, to collect more samples'
        default: '1'
      e2e_rerun_fails:
        description: 'How many times a failed e2e test is rerun. 0 turns reruns off.'
        default: '5'
      e2e_kubernetes:
        description: 'Kubernetes versions to run the e2e tests on'
        type: choice
        options: ['all', 'latest']
        default: 'all'
      e2e_controller:
        description: 'on starts the controller as a process of its own. inprocess runs it inside the e2e test binary. off runs the e2e tests with no controller: every test that needs one must fail'
        type: choice
        options: ['on', 'inprocess', 'off']
        default: 'on'
      e2e_tests_ref:
        description: 'Commit whose e2e tests and fixtures to run, against the controller and seeded bugs of this ref. Empty runs the tests of this ref.'
        default: ''
      e2e_wait_timeout:
        description: 'Seconds an e2e test waits for a condition'
        default: '90'
      e2e_seeded_bugs:
        description: 'none, all, or a comma-separated list of patches under test/e2e/seeded-bugs to apply to the controller'
        default: 'none'

env:
  # Golang version to use across CI steps
  GOLANG_VERSION: '1.26.10'

concurrency:
  # Manually dispatched runs do not cancel each other: several are started on
  # the same branch to compare configurations.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # A manual dispatch always runs the backend jobs.
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend_any_changed }}
      frontend: ${{ steps.filter.outputs.frontend_any_changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: filter
        with:
          files_yaml: |
            backend:
              - '!**.md'
              - '!docs/**'
              - '!examples/**'
            frontend:
              - 'ui/**'
              - '.github/workflows/testing.yaml'

  event_file:
    name: 'Event File'
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Event File
          path: ${{ github.event_path }}
  test-unit:
    name: Run unit tests
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Restore go build and module cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-v1-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-v1-

      - name: Download all Go modules
        run: |
          go mod download
      - name: Test
        run: make test-unit

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Unit Test Results
          path: |
            junit-unit-test.xml
      - name: Generate code coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-output-unit
          path: coverage-output-unit

  # Checks that the e2e tests are still the tests upstream had before they were
  # converted from testify suites: none lost, and no body changed without a
  # reason recorded in test/e2e/body-exceptions.yaml. Delete this job, and
  # hack/testmigration with it, once the conversion has been reviewed and merged.
  test-migration:
    name: Check the e2e test migration
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      # The upstream commit the conversion started from.
      BASELINE: b8d4cc3e1d79f1545702bf79d366d36d54214183
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every baseline test still exists
        run: go run ./hack/testmigration inventory-diff -base "$BASELINE"
      - name: No test body changed without a recorded reason
        run: go run ./hack/testmigration bodydiff -base "$BASELINE"

  test-ui:
    name: Run UI unit tests
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Run UI tests
        working-directory: ui
        run: pnpm test

  # Builds the matrix of the e2e job. By default that is one job per Kubernetes
  # version; a manual dispatch can add parallelism levels, repeated jobs and
  # seeded bugs. See hack/e2e-matrix.sh.
  e2e-plan:
    name: Plan end-to-end jobs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          VERSIONS: >-
            [
              {"version": "1.34", "k3s_version": "1.34.4+k3s1", "latest": false},
              {"version": "1.35", "k3s_version": "1.35.1+k3s1", "latest": false},
              {"version": "1.36", "k3s_version": "1.36.4+k3s1", "latest": false},
              {"version": "1.37", "k3s_version": "1.37.0+k3s1", "latest": true}
            ]
          KUBERNETES: ${{ inputs.e2e_kubernetes || 'all' }}
          PARALLEL: ${{ inputs.e2e_parallel || '8' }}
          JOBS: ${{ inputs.e2e_jobs || '1' }}
          BUGS: ${{ inputs.e2e_seeded_bugs || 'none' }}
        run: echo "matrix=$(./hack/e2e-matrix.sh)" >> "$GITHUB_OUTPUT"

  test-e2e:
    needs: [changes, e2e-plan]
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ${{ fromJSON(needs.e2e-plan.outputs.matrix) }}
    name: Run end-to-end tests (${{ matrix.kubernetes.version }}, ${{ matrix.kubernetes.latest }}${{ matrix.kubernetes.label }})
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
      - uses: actions/checkout@v7
      - name: Use the e2e tests of another commit
        if: ${{ inputs.e2e_tests_ref != '' }}
        env:
          TESTS_REF: ${{ inputs.e2e_tests_ref }}
        run: |
          # Takes test/e2e and test/fixtures from TESTS_REF and keeps everything
          # else, including the seeded bugs, from the checked-out ref. This is how
          # a "before" result is taken for tests that have since been converted.
          git fetch --depth 1 origin "$TESTS_REF"
          cp -r test/e2e/seeded-bugs "$RUNNER_TEMP/seeded-bugs"
          rm -rf test/e2e test/fixtures
          git checkout FETCH_HEAD -- test/e2e test/fixtures
          rm -rf test/e2e/seeded-bugs
          cp -r "$RUNNER_TEMP/seeded-bugs" test/e2e/seeded-bugs
          git status --short
      - name: Setup k3s
        env:
          INSTALL_K3S_VERSION: v${{ matrix.kubernetes.k3s_version }}
          # A node takes 110 pods by default, which parallel e2e tests exceed.
          INSTALL_K3S_EXEC: --kubelet-arg=max-pods=250
        run: |
          curl -sfL https://get.k3s.io | sh -
          sudo mkdir ~/.kube
          sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
          sudo chmod 755 ~/.kube/config
          kubectl version
          kubectl create ns argo-rollouts
      - uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-v1-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Download cache
        run: go mod download
      - name: Install CRDs
        run: |
          # --server-side bypasses the 262KB annotation limit for large CRDs with field descriptions
          kubectl apply --server-side --force-conflicts -k  manifests/crds
          kubectl apply --server-side --force-conflicts -f  test/e2e/crds
      - name: Apply seeded bug
        if: ${{ matrix.kubernetes.bug != '' }}
        env:
          BUG: ${{ matrix.kubernetes.bug }}
        run: git apply --verbose "test/e2e/seeded-bugs/$BUG.patch"
      - name: Pull the images the tests use
        run: |
          # Pulled up front so that image pulls are not part of any test's timing.
          for image in nginx:1.19-alpine alpine:3.8 argoproj/rollouts-demo:blue argoproj/rollouts-demo:green argoproj/rollouts-demo:red argoproj/rollouts-demo:yellow; do
            sudo k3s crictl pull "$image" || echo "::warning::could not pre-pull $image"
          done
      - name: Set up the step plugin
        run: |
          # Builds the e2e step plugin and applies the controller ConfigMap that
          # points at it. The controller reads both when it starts.
          make setup-e2e E2E_K8S_CONTEXT="$(kubectl config current-context)"
      - name: Start controller
        if: ${{ inputs.e2e_controller != 'off' && inputs.e2e_controller != 'inprocess' }}
        run: |
          make start-e2e 2>&1 | sed -r "s/[[:cntrl:]]\[[0-9]{1,3}m//g" > /tmp/e2e-controller.log &
          # Wait until it serves /healthz, so that building it is not part of any test's timing.
          timeout 600 bash -c 'until curl -sf http://localhost:8080/healthz >/dev/null; do sleep 2; done'
      - name: Run e2e tests
        env:
          E2E_PARALLEL: ${{ matrix.kubernetes.parallel }}
          E2E_TEST_OPTIONS: ${{ inputs.e2e_test_options }}
          E2E_RERUN_FAILS: ${{ inputs.e2e_rerun_fails || '5' }}
          E2E_WAIT_TIMEOUT: ${{ inputs.e2e_wait_timeout || '90' }}
          E2E_REPEAT: ${{ inputs.e2e_repeat || '1' }}
          E2E_CONTROLLER: ${{ inputs.e2e_controller || 'on' }}
          # For a controller inside the test binary: where it logs, and that
          # the test binary records its coverage.
          E2E_CONTROLLER_LOG: /tmp/e2e-controller.log
          E2E_COVERAGE: ${{ inputs.e2e_controller == 'inprocess' && 'true' || 'false' }}
        run: ./hack/run-e2e.sh
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true') }}
      - name: Check for unexpected skips
        # A test that skips looks like a test that passes. Every skip has to be
        # listed, with its reason, in test/e2e/expected-skips.txt. The list uses
        # the current test names, so the check is not run on the tests of an
        # earlier commit.
        if: ${{ !cancelled() && inputs.e2e_tests_ref == '' && hashFiles('junit-e2e-test.xml') != '' }}
        run: go run ./hack/testmigration skips -junit junit-e2e-test.xml
      - name: Stop e2e tests controller
        run: |
          pgrep -f go-build -a
          pkill -f go-build
          sleep 5
          echo "done stopping process"
          ls -lah coverage-output-e2e/
        if: ${{ inputs.e2e_controller != 'off' && inputs.e2e_controller != 'inprocess' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' && matrix.kubernetes.latest)}}
      - name: Output Rerun Overview
        run: |
          [[ -f rerunreport.txt ]] && cat rerunreport.txt || echo "No rerun report found"
      - name: Upload E2E Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: E2E Test Results (k8s ${{ matrix.kubernetes.version }}${{ matrix.kubernetes.label }})
          path: |
            junit-e2e-test.xml
            junit-e2e-run-*.xml
            e2e-timings.txt
            rerunreport.txt
      - name: Upload e2e-controller logs
        uses: actions/upload-artifact@v7
        with:
          name: e2e-controller-k8s-${{ matrix.kubernetes.version }}${{ matrix.kubernetes.label }}.log
          path: /tmp/e2e-controller.log
        if: ${{ always() }}
      - name: Upload code coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-output-e2e
          path: coverage-output-e2e
        if: ${{ matrix.kubernetes.latest && matrix.kubernetes.label == '' }}

  # workaround for status checks -- check this one job instead of each individual E2E job in the matrix
  # this allows us to skip the entire matrix when it doesn't need to run while still having accurate status checks
  # see:
  # https://github.com/argoproj/argo-workflows/pull/12006
  # https://github.com/orgs/community/discussions/9141#discussioncomment-2296809
  # https://github.com/orgs/community/discussions/26822#discussioncomment-3305794
  test-e2e-composite-result:
    name: E2E Tests - Composite result
    if: ${{ always() }}
    needs:
      - test-e2e
      - changes
    runs-on: ubuntu-latest
    steps:
      - run: |
          result="${{ needs.test-e2e.result }}"
          # mark as successful even if skipped
          if [[ $result == "success" || $result == "skipped" ]]; then
            exit 0
          else
            exit 1
          fi

  coverage-process:
    name: Process Coverage Files
    runs-on: ubuntu-latest
    needs:
      - changes
      - test-unit
      - test-e2e
    # A manual dispatch measures the e2e tests and may not produce coverage.
    if: needs.changes.outputs.backend == 'true' && github.event_name != 'workflow_dispatch'
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
        id: go
      - uses: actions/checkout@v7
      - name: Get e2e code coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-output-e2e
          path: coverage-output-e2e
      - name: Get unit test code coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-output-unit
          path: coverage-output-unit
      - name: Generate unit test coverage profile
        run: |
          go tool covdata textfmt -i=coverage-output-unit/ -o unit-coverage.out
      - name: Generate e2e test coverage profile
        run: |
          go tool covdata textfmt -i=coverage-output-e2e/ -o e2e-coverage.out
      - name: Upload unit test coverage to codecov.io
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: unit-coverage.out
          flags: unit-tests
          fail_ci_if_error: false
          codecov_yml_path: .codecov.yml
          disable_search: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload e2e test coverage to codecov.io
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: e2e-coverage.out
          flags: e2e
          fail_ci_if_error: false
          codecov_yml_path: .codecov.yml
          disable_search: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}